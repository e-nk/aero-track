# Local development database. Production uses Railway Postgres.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aerotrack
      POSTGRES_PASSWORD: aerotrack
      POSTGRES_DB: aerotrack
    ports:
      - "5433:5432" # 5433 on the host to avoid clashing with a native Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerotrack -d aerotrack"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
